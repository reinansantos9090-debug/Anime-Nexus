name: Android game validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Android unit tests and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Kotlin Android APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-nexus-kotlin-debug-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

  godot-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.9.1

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Fetch pinned Godot C++ bindings
        shell: bash
        run: |
          set -euo pipefail
          extension_dir="godot/extensions/anime_nexus_core"
          git clone --filter=blob:none https://github.com/godotengine/godot-cpp.git "$extension_dir/godot-cpp"
          git -C "$extension_dir/godot-cpp" checkout 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5

      - name: Build C++ combat extension for Linux tests and Android
        shell: bash
        run: |
          set -euo pipefail
          cd godot/extensions/anime_nexus_core
          scons platform=linux target=template_release arch=x86_64 -j2
          scons platform=android target=template_debug arch=arm64 -j2
          scons platform=android target=template_release arch=arm64 -j2

      - name: Set up Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/export_templates.tpz" "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2"
          unzip -q "$RUNNER_TEMP/godot/export_templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          debug_template=$(find "$RUNNER_TEMP/godot/templates" -type f -name 'android_debug.apk' -print -quit)
          test -n "$debug_template"
          cp "$debug_template" "$template_root/android_debug.apk"

      - name: Validate and export Godot Android APK
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --quit --path godot
          "$GODOT_BIN" --headless --path godot --script tests/test_runner.gd
          mkdir -p "$RUNNER_TEMP/game-artifacts"
          "$GODOT_BIN" --headless --path godot --export-debug "Android" "$RUNNER_TEMP/game-artifacts/anime-nexus-godot-debug.apk"

      - name: Upload Godot Android APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-nexus-godot-debug-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/game-artifacts/anime-nexus-godot-debug.apk
